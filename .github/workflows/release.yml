name: Release

# Triggered by pushing a tag such as v0.1.0. Creates a DRAFT GitHub release with the wheel, sdist and
# SHA256SUMS. Publishing to PyPI happens only if a maintainer has configured the `pypi` environment
# with Trusted Publishing (no API tokens are stored in the repository).

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    name: Build and verify tag matches version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - name: Verify tag equals package version
        run: |
          set -euo pipefail
          PKG=$(uv run --no-project python -c "import tomllib; print(tomllib.load(open('pyproject.toml','rb'))['project']['version'])")
          TAG="${GITHUB_REF_NAME#v}"
          echo "package=$PKG tag=$TAG"
          test "$PKG" = "$TAG"
      - run: uv sync --extra test
      - run: uv run pytest -m "not network" -q
      - run: uv build
      - name: Inspect and checksum artifacts
        run: |
          set -euo pipefail
          tar tzf dist/*.tar.gz | grep -E "dependencies/|\.paul/|rename\.sh|\.env" && exit 1 || true
          (cd dist && sha256sum *.whl *.tar.gz > SHA256SUMS && cat SHA256SUMS)
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  github-release:
    name: Draft GitHub release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Create draft release with artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          NOTES=docs/releases/initial-release.md
          [ -f "docs/releases/${GITHUB_REF_NAME}.md" ] && NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          gh release create "$GITHUB_REF_NAME" --draft --title "stock-screener-mcp $GITHUB_REF_NAME" --notes-file "$NOTES" dist/*.whl dist/*.tar.gz dist/SHA256SUMS

  pypi:
    name: Publish to PyPI (trusted publishing)
    needs: build
    if: github.repository == 'xabbai/stock-screener-mcp'
    runs-on: ubuntu-latest
    environment: pypi   # must be created by a maintainer; add PyPI trusted publisher first
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: dist
          path: dist/
      - name: Remove non-package files
        run: rm -f dist/SHA256SUMS
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
