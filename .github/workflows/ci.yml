name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # weekly: catches upstream TradingView/API drift via the smoke job

permissions:
  contents: read

env:
  UV_LOCKED: "1"

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uvx ruff check .
      - run: uvx ruff format --check .

  test:
    name: Tests (py${{ matrix.python }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync --extra test
      - run: uv run pytest -m "not network" -q

  docs:
    name: Generated docs in sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra test
      - run: uv run python scripts/gen_field_reference.py --check

  build:
    name: Build and inspect artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv build
      - name: Inspect artifact contents
        run: |
          set -euo pipefail
          echo "== sdist"; tar tzf dist/*.tar.gz
          echo "== wheel"; unzip -l dist/*.whl
          if tar tzf dist/*.tar.gz | grep -E "dependencies/|\.paul/|\.planning/|\.roo/|\.vscode/|rename\.sh|__pycache__|\.env"; then
            echo "Forbidden path in sdist"; exit 1
          fi
          unzip -p dist/*.whl '*/METADATA' | grep -E "^License-Expression: MIT"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dist
          path: dist/

  smoke:
    name: Clean-environment quick start (live API)
    # Needs network access to TradingView; not required on every PR.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: bash scripts/clean_env_smoke.sh 3.12

  network-tests:
    name: Live API test suite (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          python-version: "3.12"
      - run: uv sync --extra test
      - run: uv run pytest -m network -q
        env:
          STOCK_SCREENER_MCP_BROWSER_COOKIES: "off"
