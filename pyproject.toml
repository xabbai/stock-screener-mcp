[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "stock-screener-mcp"
version = "0.1.0"
description = "TradingView stock screener as an MCP tool for AI agents: 135 fields, one screen_stocks tool."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name="xabbai", email="xabbu-nfo@hotmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.26,<2",
    "tradingview-screener>=3.0,<4",
]

[project.scripts]
stock-screener-mcp = "tv_mcp.tv_mcp:_main"
tv-mcp-server = "tv_mcp.tv_mcp:_main"

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]
cookies = [
    "rookiepy"
]
dev = [
    "ruff>=0.6",
]

[project.urls]
Homepage = "https://github.com/xabbai/stock-screener-mcp"
Repository = "https://github.com/xabbai/stock-screener-mcp"
Issues = "https://github.com/xabbai/stock-screener-mcp/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/tv_mcp"]

[tool.hatch.build.targets.sdist]
only-include = [
    "src",
    "tests",
    "README.md",
    "LICENSE",
    "pyproject.toml",
    "pytest.ini",
    "config.json",
]
exclude = ["**/__pycache__"]

[tool.hatch.envs.default]
python = "3.11"

[tool.ruff]
line-length = 120
target-version = "py311"
extend-exclude = ["dependencies", ".planning", "migrate-mcp-memory"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]
# E501: the field metadata table keeps one field per line on purpose; formatting is enforced by `ruff format`.
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
