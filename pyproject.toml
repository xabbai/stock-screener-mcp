[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tv-mcp"
version = "0.1.0"
description = "A tool for stock recommendations using the tradingview API."
readme = "README.md"
authors = [
    { name="xabbai", email="xabbu-nfo@hotmail.com" }
]
requires-python = ">=3.11"

dependencies = [
    "mcp>=1.26",
    "tradingview-screener>=3.0",
]

[project.scripts]
tv-mcp-server = "tv_mcp.tv_mcp:_main"

[project.optional-dependencies]
test = [
    "pytest>=9.0",
    "pytest-asyncio>=1.3",
]
cookies = [
    "rookiepy"
]

[tool.hatch.metadata]
license = "MIT"
url = "https://github.com/xabbai/tv-mcp"

[tool.hatch.build.targets.wheel]
packages = ["src/tv_mcp"]

[tool.hatch.envs.default]
python = "3.11"
